[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiwire"
version = "0.1.0"
description = "ISO 8583 message toolkit: decode, encode and validate with JSON field specs."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LumiDev", email = "luminous@lumidev.online" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lumiwire = "lumiwire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumiwire = ["specs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
